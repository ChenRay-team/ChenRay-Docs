site_name: ChenRay 服务器规则
site_description: ChenRay 服务器官方规则文档
site_url: https://docs.chenray.top/
repo_url: https://github.com/ChenRay-team/ChenRay-Docs
repo_name: ChenRay-Docs
docs_dir: 规则
edit_uri: edit/main/规则/

theme:
  name: material
  language: zh
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# Forty 风格自定义样式（深蓝黑底 + 青色强调）
extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

# Mermaid 图渲染支持
extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js

nav:
  - 首页: index.md
  - 玩家守则: ChenRay服务器玩家守则.md
  - 管理员条例: ChenRay服务器管理员条例.md
  - 地铁乘车管理条例: ChenRay服务器地铁乘车管理条例.md
  - 假人使用教程: 假人使用教程.md
  - 处罚细目表:
      - 处罚细目表: 处罚细目表.md
      - 语言类（L）: 处罚细目/01-语言类.md
      - 破坏类（P）: 处罚细目/02-破坏类.md
      - 作弊类（C）: 处罚细目/03-作弊类.md
      - 经济类（E）: 处罚细目/04-经济类.md
      - 账号类（A）: 处罚细目/05-账号类.md
      - 管理类（M）: 处罚细目/06-管理类.md
      - 群聊社区（Q）: 处罚细目/07-群聊社区.md
  - 省流版:
      - 玩家守则省流版: 省流版/玩家守则省流版.md
      - 管理员条例省流版: 省流版/管理员条例省流版.md
      - 地铁乘车管理条例省流版: 省流版/地铁乘车管理条例省流版.md

extra:
  generator: false
