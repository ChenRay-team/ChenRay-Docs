name: 上传图片自动发布到 Releases

# 每当有人向 main 分支的 逆天言论 目录推送图片时（直接推送或 PR 合并），
# 自动把全部图片打包并发布/更新到 Releases
on:
  push:
    branches:
      - main
    paths:
      - '逆天言论/**/*.png'
      - '逆天言论/**/*.jpg'
      - '逆天言论/**/*.jpeg'
      - '逆天言论/**/*.gif'
      - '逆天言论/**/*.webp'

permissions:
  contents: write

jobs:
  release-images:
    name: 打包并发布图片
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包所有图片为 zip
        shell: bash
        run: |
          # 收集逆天言论 内全部图片文件（保留按人名的目录结构，排除 .git）
          cd 逆天言论
          find . -type f \
            \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \
               -o -name '*.gif' -o -name '*.webp' \) \
            -not -path './.git/*' \
            | zip -@ "逆天言论图片包.zip"

          count=$(find . -type f \
            \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \
               -o -name '*.gif' -o -name '*.webp' \) \
            -not -path './.git/*' \
            | wc -l)
          echo "IMAGE_COUNT=${count}" >> "$GITHUB_ENV"
          ls -lh "逆天言论图片包.zip"

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: 逆天言论图片包
          overwrite_files: true
          body: |
            ## 自动生成的图片合集包

            - 图片数量：${{ env.IMAGE_COUNT }} 张
            - 更新时间：${{ github.event.head_commit.timestamp }}
            - 触发提交：[${{ github.sha }}](${{ github.event.head_commit.url }})

            ### 📁 压缩包结构
            - **zip 根目录**：表情包 & 群友集体发言
            - **子文件夹**：按贡献者/人物分类（如 `angushushu/`、`妈妈合集/` 等）

            每次有新图片推送，此 Release 都会自动更新。下载 `逆天言论图片包.zip` 即可获得当前全部图片。
          files: |
            逆天言论/逆天言论图片包.zip
          update_release_body: true
